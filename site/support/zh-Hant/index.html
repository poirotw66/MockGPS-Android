  <h1>BloomWalk GPS 支援</h1>
  <p>此頁是可部署草稿。上架前請放到擁有者可控的 HTTPS 網站。</p>
  <ul>
    <li>請在開發人員選項中將 BloomWalk GPS 設為模擬位置應用程式。</li>
    <li>廣告、購買或線上搜尋失敗時，開始、暫停、繼續與停止仍可使用。</li>
    <li>請在 App 內「移除廣告」頁恢復購買。請勿把購買 token 寄到電子郵件。</li>
    <li>免費與付費使用者共用相同的線上搜尋與道路規劃公平使用限制。</li>
  </ul>
