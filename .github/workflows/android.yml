name: Android CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Conservative committed-secret scan
        run: |
          matches="$(git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- ':!gateway/test/' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Committed private key material is not allowed outside gateway/test."
            exit 1
          fi
          if git ls-files --error-unmatch gateway/.dev.vars >/dev/null 2>&1; then
            echo "gateway/.dev.vars must not be committed."
            exit 1
          fi
      - name: Unit tests, debug APK and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
      - name: Release verification
        run: ./gradlew assembleRelease bundleRelease --stacktrace
      - name: Release configuration check
        run: ./gradlew validateReleaseConfig --stacktrace

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Gateway lint, types and tests
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [29, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      # Larger AVD disk avoids InstallException for the MapLibre debug APK (~70MB+).
      - name: API ${{ matrix.api-level }} Google APIs instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disk-size: 4G
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --stacktrace
