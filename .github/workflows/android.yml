name: Android CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Unit tests, debug APK and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
      - name: Release verification
        run: ./gradlew assembleRelease bundleRelease --stacktrace

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [26, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      # Larger AVD disk avoids InstallException for the MapLibre debug APK (~70MB+).
      - name: API ${{ matrix.api-level }} Google APIs instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disk-size: 4G
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --stacktrace
